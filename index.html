<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flexozy Lua Obfuscator</title>
  <meta name="description" content="Flexozy Lua Obfuscator">
  <style>
    *{box-sizing:border-box}
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#080b14}
    body{margin:0;min-height:100vh;background:
      radial-gradient(circle at 15% 10%,rgba(91,111,255,.20),transparent 35%),
      radial-gradient(circle at 85% 15%,rgba(0,210,255,.12),transparent 32%),
      #080b14}
    .wrap{width:min(1180px,92%);margin:auto;padding:34px 0 48px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;background:linear-gradient(135deg,#7c5cff,#28d7ff);box-shadow:0 10px 35px rgba(69,124,255,.28)}
    h1{font-size:22px;margin:0}.sub{color:#8e9ab5;font-size:13px;margin-top:3px}
    .badge{padding:8px 12px;border:1px solid #202943;border-radius:999px;color:#9eabd0;font-size:12px;background:#0d1220}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .card{border:1px solid #202943;background:rgba(13,18,32,.82);backdrop-filter:blur(16px);border-radius:20px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.22)}
    .card h2{font-size:15px;margin:0 0 12px}.hint{font-size:12px;color:#7f8ba5}
    textarea{width:100%;min-height:430px;resize:vertical;border:1px solid #222c46;border-radius:14px;background:#080d18;color:#dce6ff;padding:16px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}
    textarea:focus{border-color:#536dff;box-shadow:0 0 0 3px rgba(83,109,255,.12)}
    .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}
    select,input{border:1px solid #26314b;background:#0a1020;color:#e7edff;border-radius:10px;padding:10px 12px;outline:none}
    .check{display:flex;align-items:center;gap:7px;color:#aeb8cf;font-size:12px}
    button{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,#6756ff,#21bde9);box-shadow:0 9px 25px rgba(55,125,255,.20)}
    button.secondary{background:#151c2d;color:#bdc8df;border:1px solid #29344e;box-shadow:none}
    button:disabled{opacity:.55;cursor:not-allowed}
    .actions{display:flex;justify-content:space-between;gap:10px;margin-top:13px}
    .status{font-size:12px;color:#8793ae;align-self:center}
    .output{min-height:430px;white-space:pre-wrap;overflow:auto;border:1px solid #222c46;border-radius:14px;background:#080d18;color:#dce6ff;padding:16px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
    footer{text-align:center;color:#59657f;font-size:12px;margin-top:20px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.output,textarea{min-height:340px}header{align-items:flex-start}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">F</div>
      <div><h1>Flexozy Lua Obfuscator</h1><div class="sub">VM-based Lua/Luau obfuscation</div></div>
    </div>
    <div class="badge" id="apiBadge">API: checking...</div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Lua Source <span class="hint">ใส่โค้ด Lua / Luau ที่ต้องการ Obfuscate</span></h2>
      <textarea id="source" spellcheck="false" placeholder="print('Hello World')"></textarea>
      <div class="controls">
        <select id="level" title="Obfuscation level">
          <option value="1">Level 1</option>
          <option value="2" selected>Level 2</option>
          <option value="3">Level 3</option>
        </select>
        <label class="check"><input id="strings" type="checkbox" checked> Strings</label>
        <label class="check"><input id="constants" type="checkbox" checked> Constants</label>
        <label class="check"><input id="antiTamper" type="checkbox" checked> Anti-tamper</label>
        <label class="check"><input id="confusable" type="checkbox" checked> Confusable</label>
        <label class="check"><input id="opaque" type="checkbox"> Opaque</label>
      </div>
      <div class="actions">
        <span class="status" id="status">พร้อมใช้งาน</span>
        <button id="obfuscate">⚡ Obfuscate</button>
      </div>
    </section>

    <section class="card">
      <h2>Output <span class="hint">ผลลัพธ์ที่ได้จาก API</span></h2>
      <div class="output" id="output">ผลลัพธ์จะแสดงที่นี่...</div>
      <div class="actions">
        <span class="status" id="meta"></span>
        <div style="display:flex;gap:8px">
          <button class="secondary" id="copy">Copy</button>
          <button class="secondary" id="clear">Clear</button>
        </div>
      </div>
    </section>
  </div>
  <footer>Flexozy API · POST /api/obfuscate</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const output = $("output"), status = $("status"), badge = $("apiBadge");

async function checkApi(){
  try{
    const r = await fetch("/api");
    const data = await r.json();
    badge.textContent = data.success ? "API: online" : "API: error";
  }catch(e){ badge.textContent = "API: offline"; }
}
checkApi();

$("obfuscate").onclick = async () => {
  const code = $("source").value;
  if(!code.trim()){ status.textContent="กรุณาใส่ Lua ก่อน"; return; }

  $("obfuscate").disabled = true;
  status.textContent = "กำลัง Obfuscate...";
  output.textContent = "Processing...";
  $("meta").textContent = "";

  try{
    const r = await fetch("/api/obfuscate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        code,
        level:Number($("level").value),
        strings:$("strings").checked,
        constants:$("constants").checked,
        antiTamper:$("antiTamper").checked,
        confusable:$("confusable").checked,
        opaque:$("opaque").checked
      })
    });
    const data = await r.json();
    if(!r.ok || !data.success) throw new Error(data.error || `HTTP ${r.status}`);
    output.textContent = data.code || "";
    $("meta").textContent = data.seed !== undefined ? `Seed: ${data.seed}` : "สำเร็จ";
    status.textContent = "Obfuscate สำเร็จ ✓";
  }catch(e){
    output.textContent = "Error: " + e.message;
    status.textContent = "เกิดข้อผิดพลาด";
  }finally{
    $("obfuscate").disabled = false;
  }
};

$("copy").onclick = async () => {
  const text = output.textContent;
  if(!text || text === "ผลลัพธ์จะแสดงที่นี่..." || text.startsWith("Error:")) return;
  await navigator.clipboard.writeText(text);
  status.textContent = "คัดลอกแล้ว ✓";
};
$("clear").onclick = () => { output.textContent="ผลลัพธ์จะแสดงที่นี่..."; $("meta").textContent=""; status.textContent="พร้อมใช้งาน"; };
</script>
</body>
</html>
