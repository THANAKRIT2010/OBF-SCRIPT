<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belzebub Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Prompt',sans-serif}

/* ── Background ── */
.lp{
    position:fixed;inset:0;z-index:9999;
    background:#08050f;
    display:flex;align-items:center;justify-content:center;
}

/* ── Canvas stars ── */
.lp__canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ── Glow blobs ── */
.lp__blob{
    position:absolute;border-radius:50%;pointer-events:none;
    filter:blur(110px);mix-blend-mode:screen;
}
.lp__blob--1{
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(109,40,217,.45) 0%,transparent 70%);
    top:-160px;left:-160px;
    animation:lp-drift1 11s ease-in-out infinite alternate;
}
.lp__blob--2{
    width:420px;height:420px;
    background:radial-gradient(circle,rgba(192,38,211,.3) 0%,transparent 70%);
    bottom:-100px;right:-80px;
    animation:lp-drift1 9s ease-in-out infinite alternate-reverse;
}
.lp__blob--3{
    width:260px;height:260px;
    background:radial-gradient(circle,rgba(59,130,246,.22) 0%,transparent 70%);
    top:55%;left:60%;
    animation:lp-drift1 13s ease-in-out infinite alternate;
}
@keyframes lp-drift1{from{transform:translate(0,0)}to{transform:translate(30px,20px)}}

/* ── Vertical line accents ── */
.lp__line{
    position:absolute;top:0;bottom:0;width:1px;pointer-events:none;
    background:linear-gradient(to bottom,transparent 0%,rgba(139,92,246,.18) 40%,rgba(139,92,246,.18) 60%,transparent 100%);
}
.lp__line--1{left:12%}
.lp__line--2{right:12%}

/* ── Content ── */
.lp__content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:32px 20px;gap:0;max-width:480px;width:100%;
}

/* ── Logo ring ── */
.lp__logo-wrap{
    position:relative;margin-bottom:28px;
}
.lp__logo{
    position:relative;z-index:1;
    width:100px;height:100px;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 0 20px rgba(139,92,246,.6)) drop-shadow(0 0 40px rgba(139,92,246,.25));
    animation:lp-float 4s ease-in-out infinite;
}
@keyframes lp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.lp__logo img{width:100%;height:100%;object-fit:contain}

/* ── Eyebrow badge ── */
.lp__eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(139,92,246,.08);
    border:1px solid rgba(139,92,246,.25);
    border-radius:999px;padding:5px 16px;margin-bottom:14px;
}
.lp__eyebrow-dot{
    width:6px;height:6px;border-radius:50%;
    background:#a78bfa;box-shadow:0 0 8px #a78bfa;
    animation:lp-pulse 1.8s ease-in-out infinite;
}
@keyframes lp-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.lp__eyebrow-txt{font-size:.72rem;font-weight:600;color:#a78bfa;letter-spacing:.05em}

/* ── Title ── */
.lp__title{
    font-size:clamp(2.2rem,8vw,3.6rem);font-weight:900;line-height:1.05;
    letter-spacing:-.01em;margin-bottom:16px;
    color:#fff;
}
.lp__title em{
    font-style:normal;
    background:linear-gradient(125deg,#a78bfa 0%,#ec4899 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── Typewriter line ── */
.lp__typewriter{
    font-size:.9rem;font-weight:400;color:rgba(255,255,255,.55);
    margin-bottom:36px;min-height:1.5em;letter-spacing:.01em;
}
.lp__typewriter::after{
    content:'|';color:#a78bfa;
    opacity:0;
    animation:lp-blink .75s step-end infinite;
}
.lp__typewriter.typing::after{ opacity:1; }
@keyframes lp-blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Buttons ── */
.lp__btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.lp__btn{
    display:flex;align-items:center;gap:10px;
    padding:14px 28px;border-radius:14px;
    font-family:'Prompt',sans-serif;font-size:.9rem;font-weight:600;
    text-decoration:none;cursor:pointer;border:none;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
    white-space:nowrap;
}
.lp__btn-icon{
    width:20px;height:20px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
}
.lp__btn-icon svg{width:18px;height:18px}

.lp__btn--ghost{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:rgba(255,255,255,.85)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
.lp__btn--ghost:hover{
    transform:translateY(-4px) scale(1.02);
    background:rgba(255,255,255,.1);
    box-shadow:0 12px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
    color:#fff!important;
}

.lp__btn--solid{
    background:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#c026d3 100%);
    color:#fff!important;
    box-shadow:0 4px 20px rgba(124,58,237,.5),0 0 40px rgba(124,58,237,.2);
    position:relative;overflow:hidden;
}
.lp__btn--solid::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);
    opacity:0;transition:opacity .2s;
}
.lp__btn--solid:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 12px 40px rgba(124,58,237,.65),0 0 60px rgba(124,58,237,.25);
    color:#fff!important;
}
.lp__btn--solid:hover::before{opacity:1}

/* ── Entrance animation ── */
.lp__content > *{
    opacity:0;transform:translateY(16px);
    animation:lp-in .5s cubic-bezier(.34,1.56,.64,1) forwards;
}
.lp__logo-wrap{animation-delay:.1s}
.lp__eyebrow{animation-delay:.2s}
.lp__title{animation-delay:.3s}
.lp__typewriter{animation-delay:.42s}
.lp__btns{animation-delay:.54s}
@keyframes lp-in{to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){
    .lp__logo,.lp__blob--1,.lp__blob--2,.lp__blob--3,
    .lp__eyebrow-dot,.lp__content > *{animation:none!important;opacity:1!important;transform:none!important}
    .lp__typewriter::after{animation:none;opacity:1}
}

@media(max-width:420px){
    .lp__btn{padding:12px 20px;font-size:.84rem}
    .lp__logo{width:80px;height:80px}
}
</style>
</head>
<body>
<div class="lp" id="lpWrap">
    <canvas class="lp__canvas" id="lpCanvas"></canvas>
    <div class="lp__blob lp__blob--1"></div>
    <div class="lp__blob lp__blob--2"></div>
    <div class="lp__blob lp__blob--3"></div>
    <div class="lp__line lp__line--1"></div>
    <div class="lp__line lp__line--2"></div>

    <div class="lp__content">
        <div class="lp__logo-wrap">
            <div class="lp__logo">
                                <img src="https://i.postimg.cc/V6T0c39T/file-0000000032d881fa914380e92f152f16.png" alt="logo">
                            </div>
        </div>

        <div class="lp__eyebrow">
            <span class="lp__eyebrow-dot"></span>
            <span class="lp__eyebrow-txt">ONLINE SHOP</span>
        </div>

        <h1 class="lp__title">
            Belzebub <em>Shop</em>        </h1>

        <p class="lp__typewriter" id="lpTypewriter"></p>

        <div class="lp__btns">
            <a class="lp__btn lp__btn--ghost" href="/user/login">
                <span class="lp__btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                </span>
                <span>เข้าสู่ระบบ</span>
            </a>
            <a class="lp__btn lp__btn--solid" href="/?home=1">
                <span class="lp__btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </svg>
                </span>
                <span>เยี่ยมชมสินค้า</span>
            </a>
        </div>
    </div>
</div>

<script>
(function(){
    /* ── Stars ── */
    var c=document.getElementById('lpCanvas'),ctx=c.getContext('2d'),W,H,stars=[];
    function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
    function init(){
        resize();
        stars=Array.from({length:180},function(){
            return{x:Math.random()*W,y:Math.random()*H,
                r:Math.random()*.9+.2,o:Math.random()*.5+.1,
                s:Math.random()*.35+.08,t:Math.random()*Math.PI*2,
                hue:Math.random()<.15?280:0};
        });
    }
    function draw(){
        ctx.clearRect(0,0,W,H);
        stars.forEach(function(s){
            s.t+=s.s*.018;
            var a=Math.max(0,s.o+Math.sin(s.t)*.28);
            ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle=s.hue?'rgba(167,139,250,'+a+')':'rgba(255,255,255,'+a+')';
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize',resize);
    init();draw();

    /* ── Typewriter ── */
    var el=document.getElementById('lpTypewriter');
    var text="\u0e22\u0e34\u0e19\u0e14\u0e35\u0e15\u0e49\u0e2d\u0e19\u0e23\u0e31\u0e1a\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48 Belzebub Shop \u0e1a\u0e23\u0e34\u0e01\u0e32\u0e23 \u0e02\u0e32\u0e22\u0e44\u0e2d\u0e14\u0e35 \u0e02\u0e32\u0e22\u0e1a\u0e31\u0e0d\u0e0a\u0e35 \u0e23\u0e31\u0e1a\u0e1b\u0e31\u0e49\u0e4a\u0e21\u0e1c\u0e39\u0e49\u0e15\u0e34\u0e14\u0e15\u0e32\u0e21 Netlix Youtube \u0e41\u0e25\u0e30\u0e2d\u0e37\u0e48\u0e19\u0e46\u0e23\u0e32\u0e04\u0e32\u0e16\u0e39\u0e01";
    var i=0,speed=52;
    el.classList.add('typing');
    function type(){
        if(i<=text.length){
            el.textContent=text.slice(0,i);
            i++;
            setTimeout(type,i===1?620:speed+(Math.random()*30-15));
        }
    }
    // เริ่ม typewriter หลัง entrance animation (delay .42s)
    setTimeout(type,520);
})();
</script>
</body>
</html>
